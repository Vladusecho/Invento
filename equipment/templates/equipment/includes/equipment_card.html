<article class="card equipment-card mb-3 shadow-sm">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <h2 class="h5 card-title mb-0">
                {{ item.name|default:"Без названия" }}
            </h2>
            {% if item.is_in_use %}
                <span class="badge bg-success">в эксплуатации</span>
            {% elif item.is_broken %}
                <span class="badge bg-danger">неисправно</span>
            {% else %}
                <span class="badge bg-secondary">{{ item.status }}</span>
            {% endif %}
        </div>
        <p class="card-text text-muted mb-2">
            <strong>Категория:</strong> {{ item.category }} |
            <strong>Модель:</strong> {{ item.model }} |
            <strong>SN:</strong> {{ item.serial_number }}
        </p>
        <p class="card-text mb-3">
            <small class="text-secondary">Локация: {{ item.location }}</small>
        </p>
        <a href="{% url 'equipment:detail' item.id %}" class="btn btn-sm btn-primary">
            Подробнее
        </a>
    </div>
</article>
