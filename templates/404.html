{% extends "base.html" %}

{% block title %}
404 – страница не найдена – Invento
{% endblock %}

{% block content %}
<div class="py-5 text-center">
    <h1 class="display-4 text-danger fw-bold">404</h1>
    <h2 class="h4 mb-3">Страница не найдена</h2>
    <p class="lead text-muted mb-4">
        Запрошенная страница не существует или была перемещена. Проверьте правильность адреса.
    </p>
    <a href="{% url 'homepage:index' %}" class="btn btn-primary px-4">
        Вернуться на главную
    </a>
</div>
{% endblock %}
