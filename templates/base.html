{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Invento{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    <header class="border-bottom bg-light mb-4">
        <div class="container d-flex flex-wrap align-items-center justify-content-between py-2">
            <a href="{% url 'homepage:index' %}" class="d-flex align-items-center text-dark text-decoration-none">
                <img src="{% static 'homepage/img/logo.png' %}" alt="Invento" class="invento-logo">
                <span class="fs-4 fw-bold">Invento</span>
            </a>
            {% include "includes/navigation.html" %}
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container mt-auto py-3">
        <p class="text-muted text-center mb-0">
            © <span id="current-year"></span> Invento – Автоматизированная система учета оборудования
        </p>
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
